<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:,">
  </head>
  <body>
    <div class="container">
      <!-- ЗАГОЛОВОК -->
      <h1>📋Тайм-менеджмент App</h1>
      <p class="subtitle">
        👋 Додай завдання, вкажи час — і не пропусти дедлайн!
      </p>

      <!-- ФОРМА ДЛЯ ДОДАВАННЯ (ДОДАНО ПОЛЕ ЧАСУ) -->
      <form class="form-row" id="taskForm">
        <input type="text" id="taskTitle" placeholder="Що зробити?" required />
        <input type="date" id="taskDate" required />
        <input type="time" id="taskTime" required />
        <select id="taskPriority">
          <option value="low">🟢 Низький</option>
          <option value="medium" selected>🟡 Середній</option>
          <option value="high">🔴 Високий</option>
        </select>
        <button type="submit">➕ Додати</button>
      </form>

      <!-- ЛІЧИЛЬНИК -->
      <div class="counter-box" id="counter">
        ✅ Виконано: <span id="doneCount">0</span> з
        <span id="totalCount">0</span>
      </div>

      <!-- СПИСОК -->
      <div id="taskList">
        <!-- Сюди JavaScript буде додавати картки -->
      </div>
    </div>

    <script type="module" src="script.js"></script> 

  
  </body>
</html>
